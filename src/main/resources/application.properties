
spring.application.name=meeting-room-booking

# Server
server.port=8080

# Oracle Database
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:MEETING_ROOM_BARU}
spring.datasource.password=${DB_PASSWORD:meeting123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.root=INFO
logging.level.com.meetingroom.booking=DEBUG
