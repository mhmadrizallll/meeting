<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Meeting Room Booking</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
      }

      .login-card {
        width: 100%;
        max-width: 420px;
        padding: 35px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin-bottom: 8px;
        font-size: 26px;
      }

      .subtitle {
        margin-bottom: 28px;
        color: #64748b;
        line-height: 1.5;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
      }

      input:focus {
        outline: none;
        border-color: #2563eb;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .alert {
        margin-bottom: 18px;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
      }

      .success {
        background: #dcfce7;
        color: #166534;
      }

      .back-link {
        display: block;
        margin-top: 22px;
        text-align: center;
        color: #2563eb;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <h1>Admin Login</h1>

      <p class="subtitle">
        Masuk untuk mengelola dan memantau pemesanan ruang meeting.
      </p>

      <div class="alert error" th:if="${param.error}">
        Username atau password salah.
      </div>

      <div class="alert success" th:if="${param.logout}">
        Anda berhasil logout.
      </div>

      <form th:action="@{/admin/login}" method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Masukkan username"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit">Login</button>
      </form>

      <a class="back-link" th:href="@{/}"> Kembali ke halaman booking </a>
    </div>
  </body>
</html>
