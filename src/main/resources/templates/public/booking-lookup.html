<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cek Booking - Meeting Room</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        background: white;
        width: 100%;
        max-width: 480px;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 15px 45px rgba(15, 23, 42, 0.08);
      }

      .logo {
        font-size: 13px;
        font-weight: bold;
        color: #2563eb;
        margin-bottom: 25px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 26px;
      }

      .subtitle {
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 25px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        padding: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        margin-bottom: 20px;
        font-size: 14px;
      }

      input:focus {
        outline: none;
        border-color: #2563eb;
      }

      button {
        width: 100%;
        background: #2563eb;
        color: white;
        border: none;
        padding: 14px;
        border-radius: 9px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
        padding: 13px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 13px;
      }

      .back {
        display: block;
        text-align: center;
        margin-top: 22px;
        color: #64748b;
        text-decoration: none;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="logo">MEETING ROOM BOOKING</div>

      <h1>Cek Booking</h1>

      <p class="subtitle">
        Masukkan kode booking dan email yang digunakan saat melakukan reservasi.
      </p>

      <div
        th:if="${errorMessage}"
        class="error"
        th:text="${errorMessage}"
      ></div>

      <form th:action="@{/booking/lookup}" method="post">
        <label>Kode Booking</label>
        <input
          type="text"
          name="bookingCode"
          placeholder="Contoh: MRB-12345678"
          required
        />

        <label>Email Pemesan</label>
        <input
          type="email"
          name="email"
          placeholder="nama@email.com"
          required
        />

        <button type="submit">Cari Booking</button>
      </form>

      <a th:href="@{/}" class="back"> ← Kembali ke halaman booking </a>
    </div>
  </body>
</html>
