<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Booking Berhasil</title>

    <style>
      body {
        margin: 0;
        padding: 30px 16px;
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        color: #1f2937;
      }

      .card {
        max-width: 550px;
        margin: 50px auto;
        padding: 35px;
        background: white;
        border-radius: 14px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
      }

      .success-icon {
        font-size: 55px;
        color: #16a34a;
      }

      .code {
        margin: 20px 0;
        padding: 15px;
        background: #f1f5f9;
        border-radius: 8px;
        font-size: 22px;
        font-weight: bold;
        color: #1d4ed8;
      }

      .detail {
        text-align: left;
        margin-top: 25px;
        line-height: 1.8;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        background: #2563eb;
        color: white;
        border-radius: 8px;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="success-icon">✓</div>

      <h1>Booking Berhasil!</h1>

      <p>Pemesanan ruang meeting Anda berhasil dibuat.</p>

      <div class="code" th:text="${booking.bookingCode}"></div>

      <div class="detail">
        <p>
          <strong>Nama:</strong>
          <span th:text="${booking.bookerName}"></span>
        </p>

        <p>
          <strong>Ruangan:</strong>
          <span th:text="${booking.meetingRoom.roomName}"></span>
        </p>

        <p>
          <strong>Agenda:</strong>
          <span th:text="${booking.agenda}"></span>
        </p>

        <p>
          <strong>Mulai:</strong>
          <span
            th:text="${#temporals.format(booking.startTime, 'dd-MM-yyyy HH:mm')}"
          ></span>
        </p>

        <p>
          <strong>Selesai:</strong>
          <span
            th:text="${#temporals.format(booking.endTime, 'dd-MM-yyyy HH:mm')}"
          ></span>
        </p>

        <p>
          <strong>Status:</strong>
          <span th:text="${booking.status}"></span>
        </p>
      </div>

      <a th:href="@{/}"> Kembali ke Halaman Booking </a>
    </div>
  </body>
</html>
